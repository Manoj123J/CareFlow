<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Consultation - CareFlow</title>
    
  
    <link rel="stylesheet" href="css/common.css">
  
    <link rel="stylesheet" href="css/appointment.css">
</head>
<body>

   
    <header class="navbar">
        <div class="container nav-container">
           
            <a href="index.html" class="logo">🏥 CareFlow</a>
            
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="emergency.html">Emergency</a></li>
                    <li><a href="appointment.html" class="active">Appointment</a></li>
                    <li><a href="health_card.html">Health Card</a></li>
                    <li><a href="login.html" class="btn btn-primary">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

   
    <main class="container">
        <div class="form-container">
            <h2 class="section-title">Book Consultation</h2>
            
           
            <form action="success.html" method="get">
                
                <div class="form-group">
                    <label for="patient-name">Patient Name</label>
                    <input type="text" id="patient-name" name="patientName" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="patient-age">Age</label>
                    <input type="number" id="patient-age" name="age" placeholder="Enter your age" min="1" max="120" required>
                </div>

                <div class="form-group">
                    <label for="purpose">Consultation Purpose</label>
                    <select id="purpose" name="purpose" required>
                        <option value="" disabled selected>Select a purpose</option>
                        <option value="General Checkup">General Checkup</option>
                        <option value="Fever">Fever</option>
                        <option value="Follow-up">Follow-up</option>
                        <option value="Emergency">Emergency</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="preferred-time">Preferred Time</label>
                    <input type="datetime-local" id="preferred-time" name="preferredTime" required>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Book Appointment</button>

            </form>
        </div>

    </main>

    <footer>
        <div class="container">
            <p>CareFlow © 2026</p>
        </div>
    </footer>

</body>
</html>
